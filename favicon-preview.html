<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <title>Preview — favicon brújula pirata</title>
  <style>
    body { background:#0f0d0a; color:#FFFDF8; font-family:Georgia,serif; padding:32px; }
    .grid { display:flex; gap:32px; flex-wrap:wrap; align-items:flex-end; }
    .card { background:#1a1611; border:1px solid #3a3026; border-radius:12px; padding:20px; text-align:center; }
    .card img { display:block; margin:0 auto 10px; image-rendering:auto; }
    .lbl { font-size:12px; color:#EEC67C; letter-spacing:1px; }
    .big img { border-radius:50%; box-shadow:0 8px 30px rgba(0,0,0,.6); }
    h1 { color:#07CEF5; font-weight:normal; }
  </style>
</head>
<body>
  <h1>Favicon · Brújula de mapa del tesoro</h1>
  <p>Colores: #EEC67C · #FFFDF8 · acento #07CEF5</p>
  <div class="grid">
    <div class="card big"><img src="favicon.svg" width="256" height="256" alt=""><div class="lbl">256 px</div></div>
    <div class="card"><img src="favicon.svg" width="128" height="128" alt=""><div class="lbl">128 px</div></div>
    <div class="card"><img src="favicon.svg" width="64" height="64" alt=""><div class="lbl">64 px</div></div>
    <div class="card"><img src="favicon.svg" width="48" height="48" alt=""><div class="lbl">48 px</div></div>
    <div class="card"><img src="favicon.svg" width="32" height="32" alt=""><div class="lbl">32 px</div></div>
    <div class="card"><img src="favicon.svg" width="16" height="16" alt=""><div class="lbl">16 px</div></div>
  </div>
</body>
</html>
